name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select E,W,F --ignore E501

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      OPENAI_API_KEY: test-key
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  schema-check:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pydantic>=2.7"
      - run: python -c "from schemas.models import IPReputationResult, FirewallRule, ThreatAssessment; print('Schema OK')"

  guardrails-check:
    name: Guardrails
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pytest>=8.2"
      - run: python -m pytest tests/test_guardrails.py tests/test_schemas.py -v --tb=short
