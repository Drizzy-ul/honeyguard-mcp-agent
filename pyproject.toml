[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "honeyguard-mcp-agent"
version = "0.1.0"
description = "AI-powered threat-triage agent with MCP, RAG, and LLM tool-calling"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]
